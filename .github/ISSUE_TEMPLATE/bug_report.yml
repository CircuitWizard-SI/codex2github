name: 问题反馈
description: 反馈程序问题，勿提交私人任务或敏感会话内容。
body:
  - type: markdown
    attributes:
      value: "本仓库用于源码与反馈。远程任务请使用自己的私有仓库；所有示例与日志请先脱敏。"
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: Windows、Python、Codex CLI 与 codex2github 版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤和实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
